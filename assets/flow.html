<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f5f5f5;font-family:Segoe UI,system-ui,-apple-system,sans-serif}
svg{display:block}
.rect{fill:#ececec;stroke:#bfc0c0;stroke-width:1.2}
.diam{fill:rgba(235,108,54,0.10);stroke:#eb6c36;stroke-width:1.4}
.oval{fill:#ececec;stroke:#bfc0c0;stroke-width:1.2}
.rect.coral{fill:rgba(235,108,54,0.08);stroke:#eb6c36}
.t{fill:#2d3142;font-size:12px;font-weight:600}
.s{fill:#7a8399;font-size:9px;font-family:Consolas,'Courier New',monospace}
.eb{fill:#4f5d75;font-size:8px;letter-spacing:0.18em;font-weight:500;text-transform:uppercase;font-family:Consolas,'Courier New',monospace}
.arrow{stroke:#4f5d75;stroke-width:1.2;fill:none}
.al{fill:#7a8399;font-size:9px;font-family:Consolas,'Courier New',monospace}
.arrowhead{fill:#4f5d75}
</style></head><body>
<svg width="960" height="600" viewBox="0 0 960 600">
  <defs><marker id="af" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" class="arrowhead"/></marker></defs>

  <text x="28" y="30" class="eb">Flow · Agent Roundtable</text>
  <text x="28" y="56" class="t" style="font-size:17px">Roundtable Flow</text>
  <text x="28" y="73" class="s">run_roundtable: load panel → optional RAG → rounds → summary → report</text>

  <g class="arrow" marker-end="url(#af)">
    <path d="M340,80 V96"/>
    <path d="M340,134 V150"/>
    <path d="M340,188 V204"/>
    <path d="M340,242 V258"/>
    <path d="M340,270 V270"/>
    <path d="M465,330 H560 V223 H440"/>
    <path d="M340,390 V430"/>
    <path d="M340,466 V486"/>
    <path d="M340,522 V518"/>
  </g>

  <ellipse class="oval" cx="340" cy="52" rx="90" ry="28"/>
  <text x="300" y="57" class="t">run_roundtable</text>
  <rect class="rect" x="240" y="96" width="200" height="38" rx="6"/>
  <text x="258" y="120" class="t">load council / personas</text>
  <rect class="rect" x="240" y="150" width="200" height="38" rx="6"/>
  <text x="266" y="174" class="t">search_knowledge (opt)</text>
  <rect class="rect" x="240" y="204" width="200" height="38" rx="6"/>
  <text x="252" y="228" class="t">rounds: moderator + experts</text>
  <rect class="rect" x="240" y="258" width="200" height="38" rx="6"/>
  <text x="272" y="282" class="t">round summaries</text>
  <polygon class="diam" points="340,390 215,330 340,270 465,330"/>
  <text x="298" y="334" class="t" style="fill:#b34d1f">more rounds?</text>

  <rect class="rect coral" x="240" y="430" width="200" height="38" rx="6"/>
  <text x="272" y="454" class="t" style="fill:#b34d1f">final summary</text>
  <rect class="rect" x="240" y="486" width="200" height="38" rx="6"/>
  <text x="272" y="510" class="t">save markdown report</text>
  <ellipse class="oval" cx="340" cy="546" rx="92" ry="28"/>
  <text x="300" y="551" class="t">return result</text>

  <text x="572" y="282" class="al">yes</text>
  <text x="352" y="410" class="al">no</text>

</svg>
</body></html>
