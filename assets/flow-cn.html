<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f5f5f5;font-family:'Microsoft YaHei','Segoe UI',system-ui,sans-serif}
svg{display:block}
.rect{fill:#ececec;stroke:#bfc0c0;stroke-width:1.2}
.diam{fill:rgba(235,108,54,0.10);stroke:#eb6c36;stroke-width:1.4}
.oval{fill:#ececec;stroke:#bfc0c0;stroke-width:1.2}
.rect.coral{fill:rgba(235,108,54,0.08);stroke:#eb6c36}
.t{fill:#2d3142;font-size:12px;font-weight:600}
.s{fill:#7a8399;font-size:9px;font-family:'Microsoft YaHei','Segoe UI',sans-serif}
.eb{fill:#4f5d75;font-size:8px;letter-spacing:0.18em;font-weight:500;text-transform:uppercase;font-family:'Microsoft YaHei','Segoe UI',sans-serif}
.arrow{stroke:#4f5d75;stroke-width:1.2;fill:none}
.al{fill:#7a8399;font-size:9px;font-family:'Microsoft YaHei','Segoe UI',sans-serif}
.arrowhead{fill:#4f5d75}
</style></head><body>
<svg width="960" height="600" viewBox="0 0 960 600">
